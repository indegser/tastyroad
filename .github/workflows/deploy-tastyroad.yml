name: Deploy Tastyroad

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install collector dependencies
        run: python3 -m pip install --upgrade yt-dlp

      - name: Build static HTML
        run: python3 scripts/build_site.py --output public/index.html

      - name: Deploy to Vercel production
        run: pnpm dlx vercel@latest --prod --yes --token "$VERCEL_TOKEN"
