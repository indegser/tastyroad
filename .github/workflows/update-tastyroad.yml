name: Update Tastyroad Data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"

concurrency:
  group: tastyroad-auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      HAS_APP_TOKEN_SECRETS: ${{ secrets.TASTYROAD_APP_ID != '' && secrets.TASTYROAD_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Create GitHub App token
        id: app-token
        if: env.HAS_APP_TOKEN_SECRETS == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.TASTYROAD_APP_ID }}
          private-key: ${{ secrets.TASTYROAD_APP_PRIVATE_KEY }}

      - name: Select automation token
        id: automation-token
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          FALLBACK_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$APP_TOKEN" ]; then
            echo "token=$APP_TOKEN" >> "$GITHUB_OUTPUT"
          else
            echo "token=$FALLBACK_TOKEN" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.automation-token.outputs.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install collector dependencies
        run: python3 -m pip install --upgrade yt-dlp

      - name: Collect data and build HTML
        run: python3 scripts/build_site.py --output public/index.html

      - name: Create pull request
        id: create-pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ steps.automation-token.outputs.token }}
          branch: tastyroad/auto-update
          delete-branch: true
          commit-message: "chore: update tastyroad data"
          title: "chore: update tastyroad data"
          body: |
            Automated update from the Tastyroad collector.

            This PR contains changed source data and the rendered static HTML.
          add-paths: |
            data/raw/youtube/*.json
            public/index.html

      - name: Merge pull request
        if: steps.create-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.automation-token.outputs.token }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
